# _brand.yml allows you to apply your branding to every document produced within a quarto project

#################
# Custom Colors #
#################

color:
  palette:
    purple: "#8A5CF5"
    pink: "#ff9fdf"
    light-pink: "#ffddf2"
    dark-grey: "#222222"
  primary: purple
  background: light-pink 
  foreground: black

################
# Brand Assets #
################

logo: 
  medium: assets/images/logo.svg #dont need small and large sizes for svg